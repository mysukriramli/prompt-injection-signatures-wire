name: Prompt Injection Signatures Engine

on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prompt-signatures-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/prompt_signatures.db
          key: prompt-signatures-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            prompt-signatures-db-${{ runner.os }}-
            prompt-signatures-db-

      - name: Execute Signatures Engine
        run: |
          if [ -f signature_engine.py ]; then
            python signature_engine.py
          else
            echo "signature_engine.py not found"
          fi

      - name: Ensure Pages Directory Exists
        run: |
          mkdir -p public
          touch public/.nojekyll

      - name: Create Fallback Index Page
        run: |
          if [ ! -f public/index.html ]; then

            echo '<!DOCTYPE html>' > public/index.html
            echo '<html lang="en">' >> public/index.html
            echo '<head>' >> public/index.html
            echo '  <meta charset="UTF-8">' >> public/index.html
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">' >> public/index.html
            echo '  <title>Prompt Injection Signatures Engine</title>' >> public/index.html
            echo '  <style>' >> public/index.html
            echo '    body {' >> public/index.html
            echo '      margin: 40px;' >> public/index.html
            echo '      font-family: system-ui, sans-serif;' >> public/index.html
            echo '      background: #0f172a;' >> public/index.html
            echo '      color: #ffffff;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    .card {' >> public/index.html
            echo '      max-width: 900px;' >> public/index.html
            echo '      margin: auto;' >> public/index.html
            echo '      padding: 24px;' >> public/index.html
            echo '      border-radius: 12px;' >> public/index.html
            echo '      background: #111827;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    h1 {' >> public/index.html
            echo '      color: #22c55e;' >> public/index.html
            echo '    }' >> public/index.html
            echo '  </style>' >> public/index.html
            echo '</head>' >> public/index.html
            echo '<body>' >> public/index.html
            echo '  <div class="card">' >> public/index.html
            echo '    <h1>Prompt Injection Signatures Engine</h1>' >> public/index.html
            echo '    <p>Signature compilation service running.</p>' >> public/index.html
            echo '    <p>Historical ledger successfully published.</p>' >> public/index.html
            echo '    <p>Generated automatically by GitHub Actions.</p>' >> public/index.html
            echo '  </div>' >> public/index.html
            echo '</body>' >> public/index.html
            echo '</html>' >> public/index.html

          fi

      - name: Validate Generated Site
        run: |
          echo "===== PUBLIC DIRECTORY ====="
          find public -type f

          echo ""
          echo "===== INDEX CHECK ====="

          test -d public
          test -f public/index.html

          wc -c public/index.html

      - name: Commit and Push Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history/ || true
          [ -d public ] && git add public/ || true

          if git diff --cached --quiet; then

            echo "No signature drift detected."

          else

            git commit -m "chore(history): record injection signature updates [skip ci]" || true

            git pull --rebase --autostash origin "${{ github.ref_name }}" || true

            git push origin HEAD:${{ github.ref_name }} || true

          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Artifact Contents
        run: |
          echo "===== FINAL ARTIFACT ====="

          find public -type f

          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html missing"
            exit 1
          fi

          if [ ! -s public/index.html ]; then
            echo "ERROR: public/index.html empty"
            exit 1
          fi

          echo "Artifact validation passed"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Confirm Artifact Upload Step
        run: |
          echo "GitHub Pages artifact upload completed"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "=================================="
          echo "Prompt Injection Signatures Engine"
          echo "Deployment complete"
          echo "=================================="
          echo "${{ steps.deployment.outputs.page_url }}"
