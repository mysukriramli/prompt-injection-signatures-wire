name: Prompt Injection Signatures Engine

on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prompt-injection-signatures
  cancel-in-progress: true

jobs:
  ingest-and-build:
    name: Ingest and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/prompt_signatures.db
          key: prompt-signatures-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            prompt-signatures-db-${{ runner.os }}-
            prompt-signatures-db-

      - name: Execute Signatures Engine
        run: |
          mkdir -p data public
          if [ -f signature_engine.py ]; then
            python signature_engine.py
          else
            echo "signature_engine.py not found"
          fi

      - name: Create Pages Output
        run: |
          mkdir -p public
          touch public/.nojekyll

          if [ ! -s public/index.html ]; then
            cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Prompt Injection Signatures Engine</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                margin: 40px;
                background: #0f172a;
                color: #ffffff;
              }
              .card {
                max-width: 900px;
                margin: auto;
                padding: 24px;
                background: #111827;
                border-radius: 12px;
              }
              h1 {
                color: #22c55e;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Prompt Injection Signatures Engine</h1>
              <p>Signature compilation service running.</p>
              <p>Historical ledger successfully published.</p>
              <p>Generated automatically by GitHub Actions.</p>
            </div>
          </body>
          </html>
          EOF
          fi

      - name: Validate Pages Payload
        run: |
          set -euxo pipefail
          pwd
          ls -la
          ls -la public
          find public -type f
          test -d public
          test -f public/index.html
          test -s public/index.html
          wc -c public/index.html

      - name: Commit Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history || true
          [ -d public ] && git add public || true

          if git diff --cached --quiet; then
            echo "No signature drift detected."
          else
            git commit -m "chore(history): record injection signature updates [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: ingest-and-build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15

      - name: Deployment Summary
        run: |
          echo "===================================="
          echo "Prompt Injection Signatures Engine"
          echo "Deployment Complete"
          echo "===================================="
          echo "${{ steps.deployment.outputs.page_url }}"
