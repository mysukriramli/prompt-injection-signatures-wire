name: Prompt Injection Signatures Engine

on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prompt-signatures-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/prompt_signatures.db
          key: prompt-signatures-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            prompt-signatures-db-${{ runner.os }}-
            prompt-signatures-db-

      - name: Execute Signatures Engine
        run: |
          if [ -f signature_engine.py ]; then
            python signature_engine.py
          else
            echo "signature_engine.py not found"
          fi

      - name: Prepare GitHub Pages Output
        run: |
          mkdir -p public

          touch public/.nojekyll

          if [ ! -f public/index.html ]; then
            cat > public/index.html <<'HTML'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Injection Signatures Engine</title>
<style>
body{
  font-family:system-ui,sans-serif;
  margin:40px;
  background:#0f172a;
  color:#ffffff;
}
.card{
  max-width:900px;
  margin:auto;
  padding:24px;
  border-radius:12px;
  background:#111827;
}
h1{
  color:#22c55e;
}
</style>
</head>
<body>
<div class="card">
<h1>Prompt Injection Signatures Engine</h1>
<p>Signature compilation service running.</p>
<p>Historical ledger successfully published.</p>
</div>
</body>
</html>
HTML
          fi

      - name: Validate Pages Directory
        run: |
          echo "Listing Pages payload"
          find public -type f

          test -d public
          test -f public/index.html

      - name: Commit and Push Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history/ || true
          [ -d public ] && git add public/ || true

          if git diff --cached --quiet; then
            echo "No signature drift detected."
          else
            git commit -m "chore(history): record injection signature updates [skip ci]" || true

            git pull --rebase --autostash origin "${{ github.ref_name }}" || true

            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages Payload
        run: |
          echo "Final artifact contents:"
          find public -type f

          if [ ! -f public/index.html ]; then
            echo "Pages artifact missing"
            exit 1
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment Complete"
          echo "${{ steps.deployment.outputs.page_url }}"
